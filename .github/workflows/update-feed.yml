name: Publish app update feed
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to synchronize
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: update-feed
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          tag=os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9][A-Za-z0-9._-]{0,99}', tag):
              raise SystemExit('Use a release tag beginning with v and a version number, e.g. v1.1.10-tv')
          PY
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > .release.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir .release-assets
      - name: Inspect signed APKs and generate channel updates
        run: |
          set -euo pipefail
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          python3 scripts/update_feed.py --release .release.json --assets .release-assets --aapt "$tools_dir/aapt" --apksigner "$tools_dir/apksigner"
      - name: Commit updated feed
        run: |
          set -euo pipefail
          if git diff --quiet -- updates.json; then
            echo 'No channel version change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates.json
          git commit -m 'Update published app versions'
          git push origin HEAD:main
